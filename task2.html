<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSCC Task 2 - Interactive Web Feature</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 500px;
            text-align: center;
        }
        h1 { color: #28a745; }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
        }
        button:hover { background-color: #218838; }
        #output { margin-top: 15px; font-weight: bold; color: #555; }
    </style>
</head>
<body>
    <div class="card">
        <h1>NSCC SRM Recruitment Submission</h1>
        <h2>Task 2: Interactive Feature</h2>
        <p>Click the button below to verify functionality for Task 2.</p>
        <button onclick="runCheck()">Verify Task 2</button>
        <div id="output"></div>
    </div>

    <script>
        function runCheck() {
            document.getElementById('output').innerText = "Task 2 JS execution successful!";
        }
    </script>
</body>
</html>
