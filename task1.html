<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSCC Task 1 - Web Development</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;

        p { font-size: 1.1rem; line-height: 1.5; }
        .tag {
            display: inline-block;
            background: #e1f0ff;
            color: #0056b3;
            padding: 5px 12px;
            border-radius: 15px;
            font-weight: bold;
            margin-top: 10px;
        }

</head>
<body>
    <div class="container">
        <h1>NSCC SRM Recruitment Submission</h1>
        <h2>Task 1: Basic Structure & Layout</h2>
